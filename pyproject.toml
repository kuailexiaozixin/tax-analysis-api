[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-analysis-api"
version = "0.2.2"
description = "税务问题分析引擎的 HTTP API 适配器"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.143,<1",
    "uvicorn>=0.54,<1",
    "pydantic>=2.13,<3",
    "requests>=2.25,<3",
    "urllib3>=1.26,<3",
    "playwright>=1.40,<2",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28"]

[project.scripts]
tax-analysis-api = "tax_engine_api.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tax_engine_api = [
    "runtime/MANIFEST.json",
    "runtime/scripts/*.py",
    "runtime/data/*.json",
    "runtime/references/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
