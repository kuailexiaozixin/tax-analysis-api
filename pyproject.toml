[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-analysis-api"
version = "0.1.0"
description = "tax-analysis-engine 的 HTTP API 适配器"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.143,<1",
    "uvicorn>=0.54,<1",
    "pydantic>=2.13,<3",
    "requests>=2.25,<3",
    "urllib3>=1.26,<3",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28"]

[project.scripts]
tax-analysis-api = "tax_engine_api.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
